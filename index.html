<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estufa Holográfica Realista</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: radial-gradient(circle at center, #1a1a24 0%, #050505 80%); 
            overflow: hidden; 
            font-family: 'Rajdhani', sans-serif; 
            color: #fff;
        }
        
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .title {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 14px;
            color: #888;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(20, 20, 20, 0.6);
            color: #bc13fe;
            border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(188, 19, 254, 0.0);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button:hover { 
            background: rgba(188, 19, 254, 0.1); 
            border: 1px solid rgba(188, 19, 254, 0.8);
            box-shadow: 0 4px 20px rgba(188, 19, 254, 0.4), inset 0 0 20px rgba(188, 19, 254, 0.2);
            text-shadow: 0 0 8px #bc13fe;
        }

        button.active {
            background: rgba(188, 19, 254, 0.2);
            color: #fff;
            border-color: #bc13fe;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.6), inset 0 0 20px rgba(188, 19, 254, 0.4);
            text-shadow: 0 0 10px #fff;
        }

        canvas { display: block; outline: none; }
    </style>
</head>
<body>

<div id="ui-container">
    <div class="title">Sistema de Cultivo Biológico</div>
    <button id="uv-toggle">INICIAR LUZ UV</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(4, 3, 6);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;

    // Piso Reflexivo
    const floorGeo = new THREE.PlaneGeometry(50, 50);
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x050505, roughness: 0.1, metalness: 0.8  
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.5;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(50, 50, 0x333333, 0x111111);
    grid.position.y = -1.49;
    scene.add(grid);

    // Aquário (Vidro)
    const glassGeo = new THREE.BoxGeometry(4, 2.5, 2);
    const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, metalness: 0.1, roughness: 0.05,
        transmission: 0.9, ior: 1.5, thickness: 0.5,
        transparent: true, side: THREE.DoubleSide
    });
    const aquarium = new THREE.Mesh(glassGeo, glassMat);
    aquarium.castShadow = true;
    scene.add(aquarium);

    const edges = new THREE.EdgesGeometry(glassGeo);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x555555, linewidth: 2 });
    const line = new THREE.LineSegments(edges, lineMat);
    scene.add(line);

    // Solo
    const dirtGeo = new THREE.BoxGeometry(3.9, 0.3, 1.9);
    const dirtMat = new THREE.MeshStandardMaterial({ 
        color: 0x221508, roughness: 0.9, metalness: 0.1
    });
    const soil = new THREE.Mesh(dirtGeo, dirtMat);
    soil.position.y = -1.1;
    soil.receiveShadow = true;
    soil.castShadow = true;
    scene.add(soil);

    // ----------------------------------------------------
    // NOVO SISTEMA DE PLANTAS PROCEDURAIS (Adeus pirulitos!)
    // ----------------------------------------------------
    const plantGroupMain = new THREE.Group();
    
    // Material orgânico para as folhas (levemente brilhante)
    const leafMat = new THREE.MeshStandardMaterial({ 
        color: 0x2d9a65, // Verde azulado / ciano
        roughness: 0.3, 
        metalness: 0.1,
        side: THREE.DoubleSide
    });

    for (let i = 0; i < 8; i++) { // 8 plantas
        const plant = new THREE.Group();
        
        // Criando a flor/suculenta em camadas
        const layers = 4; // Quantidade de anéis de pétalas
        let leafGeo = new THREE.SphereGeometry(0.1, 8, 8); // Esfera base
        
        for (let l = 0; l < layers; l++) {
            const petalsPerLayer = 5 + l * 2; // Mais pétalas nas camadas externas
            const angleOffset = (Math.PI * 2) / petalsPerLayer;
            
            for (let p = 0; p < petalsPerLayer; p++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                
                // Amassa e alonga a esfera para virar uma folha chata e pontuda
                leaf.scale.set(0.6, 2.0, 0.15); 
                
                const angle = p * angleOffset + (l * 0.5); // Desloca levemente cada camada
                const radius = 0.05 + (l * 0.08); // Distância do centro
                
                leaf.position.x = Math.cos(angle) * radius;
                leaf.position.z = Math.sin(angle) * radius;
                leaf.position.y = (l * 0.03); // Camadas internas ficam levemente mais baixas/altas
                
                // Apontar a folha para fora e inclinar
                leaf.rotation.y = -angle + Math.PI / 2; 
                // Camadas de fora caem mais, camadas de dentro apontam para cima
                leaf.rotation.z = -Math.PI / 3 + (l * 0.25); 
                
                leaf.castShadow = true;
                leaf.receiveShadow = true;
                plant.add(leaf);
            }
        }
        
        // Centro da planta (pequeno núcleo que parece broto)
        const coreGeo = new THREE.SphereGeometry(0.06);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x88ffaa, roughness: 0.5 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.y = 0.1;
        plant.add(core);

        // Espalhando pelo solo aleatoriamente
        plant.position.set((Math.random() - 0.5) * 3.4, -0.92, (Math.random() - 0.5) * 1.5);
        
        // Variando tamanhos e rotação inicial
        const scale = 0.6 + Math.random() * 0.6;
        plant.scale.set(scale, scale, scale);
        plant.rotation.y = Math.random() * Math.PI;
        
        plantGroupMain.add(plant);
    }
    scene.add(plantGroupMain);
    // ----------------------------------------------------

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const spotLight = new THREE.SpotLight(0xffffff, 0.5);
    spotLight.position.set(5, 10, 5);
    spotLight.angle = Math.PI / 4;
    spotLight.penumbra = 0.5;
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.width = 2048;
    spotLight.shadow.mapSize.height = 2048;
    scene.add(spotLight);

    // Sistema UV
    const uvLights = [];
    const leds = [];
    const lightPositions = [
        [1.85, 1.1, 0.85], [-1.85, 1.1, 0.85], 
        [1.85, 1.1, -0.85], [-1.85, 1.1, -0.85]
    ];

    lightPositions.forEach(pos => {
        const light = new THREE.PointLight(0x9d00ff, 0, 8, 2); 
        light.position.set(pos[0], pos[1], pos[2]);
        light.castShadow = true;
        light.shadow.bias = -0.001; 
        scene.add(light);
        uvLights.push(light);

        const ledGeo = new THREE.BoxGeometry(0.1, 0.05, 0.1);
        const ledMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, emissive: 0x000000, emissiveIntensity: 0
        });
        const led = new THREE.Mesh(ledGeo, ledMat);
        led.position.set(pos[0], pos[1] + 0.1, pos[2]);
        scene.add(led);
        leds.push(led);
    });

    // Lógica do Botão
    let uvOn = false;
    let targetIntensity = 0;
    const btn = document.getElementById('uv-toggle');
    
    btn.onclick = () => {
        uvOn = !uvOn;
        targetIntensity = uvOn ? 3.5 : 0; 
        
        if(uvOn) {
            btn.innerText = "DESLIGAR LUZ UV";
            btn.classList.add('active');
            lineMat.color.setHex(0x9d00ff); 
        } else {
            btn.innerText = "INICIAR LUZ UV";
            btn.classList.remove('active');
            lineMat.color.setHex(0x555555); 
        }
        
        leds.forEach(led => {
            led.material.emissive.setHex(uvOn ? 0x9d00ff : 0x000000);
            led.material.emissiveIntensity = uvOn ? 5 : 0;
        });
    };

    // Loop
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        scene.rotation.y += 0.002;
        uvLights.forEach(light => {
            light.intensity += (targetIntensity - light.intensity) * 0.1;
        });
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
</html>
